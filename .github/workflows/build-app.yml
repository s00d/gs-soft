# Manual only. Builds the private s00d/gateway-soft-rs here, in public, so Actions minutes are free.
# Nothing of the source may leak from this public repo:
#  - checkout with a read-only deploy key (SOURCE_DEPLOY_KEY), credentials not kept in .git;
#  - no caches of source-derived files (rust-cache keeps the crates registry only, not target/);
#  - build output goes through ci/quiet.mjs: hidden on success, encrypted for the owner on failure
#    (compiler errors quote source lines); no workflow artifacts other than that encrypted log;
#  - releases carry only the built binaries.
name: Build App

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated: macos, linux, linux-aarch64, linux-armv7, windows, windows-x86, windows-arm64 (empty = all)"
        required: false
        default: ""
      ref:
        description: "Branch, tag or full 40-char commit SHA to build (empty = the dispatch branch); rebuild one platform of an existing release from its commit"
        required: false
        default: ""

permissions:
  contents: write

env:
  LOG_PUBLIC_KEY: ${{ secrets.LOG_PUBLIC_KEY }}
  # btleplug (BLE ports) links libdbus on Linux.
  LINUX_DEPS: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libudev-dev libasound2-dev libdbus-1-dev

jobs:
  # Picks the matrix entries to build (`platforms` input; empty = all).
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          # ARM Linux is cross-compiled: deb + rpm only (AppImage needs an ARM host).
          # armv7: tauri-action looks for `_armv7` names, the bundler writes `armhf` / `armhfp`,
          # so it only builds and the "Upload bundles (manual)" step uploads.
          entries = [
              {"os": "macos", "platform": "macos-latest", "args": "--target universal-apple-darwin", "rust_targets": "aarch64-apple-darwin,x86_64-apple-darwin"},
              {"os": "linux", "platform": "ubuntu-22.04", "args": ""},
              {"os": "linux-aarch64", "platform": "ubuntu-22.04", "args": "--target aarch64-unknown-linux-gnu --bundles deb,rpm", "rust_targets": "aarch64-unknown-linux-gnu", "deb_arch": "arm64", "gnu": "aarch64-linux-gnu"},
              {"os": "linux-armv7", "platform": "ubuntu-22.04", "args": "--target armv7-unknown-linux-gnueabihf --bundles deb,rpm", "rust_targets": "armv7-unknown-linux-gnueabihf", "deb_arch": "armhf", "gnu": "arm-linux-gnueabihf", "manual_upload": True},
              {"os": "windows", "platform": "windows-latest", "args": ""},
              {"os": "windows-x86", "platform": "windows-latest", "args": "--target i686-pc-windows-msvc", "rust_targets": "i686-pc-windows-msvc"},
              {"os": "windows-arm64", "platform": "windows-latest", "args": "--target aarch64-pc-windows-msvc --bundles nsis", "rust_targets": "aarch64-pc-windows-msvc"}
          ]
          wanted = {p.strip() for p in os.environ.get("PLATFORMS", "").split(",") if p.strip()}
          unknown = wanted - {e["os"] for e in entries}
          if unknown:
              raise SystemExit(f"unknown platforms: {sorted(unknown)}")
          picked = [e for e in entries if not wanted or e["os"] in wanted]
          print("matrix=" + json.dumps({"include": picked}))
          PY

  build-tauri:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: s00d/gateway-soft-rs
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          path: .ci
          sparse-checkout: ci
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          cache-targets: "false"

      - name: Install dependencies (Linux amd64)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS patchelf

      - name: Install cross dependencies (Linux ARM)
        if: matrix.deb_arch
        env:
          ARCH: ${{ matrix.deb_arch }}
          GNU: ${{ matrix.gnu }}
        run: |
          # Existing mirrors carry amd64 only: pin them, add ports.ubuntu.com for the target arch.
          sudo sed -i -E 's/^deb (https?|mirror)/deb [arch=amd64] \1/' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          for suite in "$CODENAME" "$CODENAME-updates" "$CODENAME-security"; do
            echo "deb [arch=$ARCH] http://ports.ubuntu.com/ubuntu-ports $suite main restricted universe multiverse"
          done | sudo tee /etc/apt/sources.list.d/ports.list
          sudo dpkg --add-architecture "$ARCH"
          sudo apt-get update
          sudo apt-get install -y "gcc-$GNU" "g++-$GNU" pkg-config patchelf \
            $(for p in $LINUX_DEPS libgtk-3-dev; do echo "$p:$ARCH"; done)
          TARGET="${{ matrix.rust_targets }}"
          T="${TARGET//-/_}"
          {
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_SYSROOT_DIR=/usr/$GNU/"
            echo "PKG_CONFIG_PATH=/usr/lib/$GNU/pkgconfig"
            echo "CC_${T}=$GNU-gcc"
            echo "CXX_${T}=$GNU-g++"
            echo "CARGO_TARGET_${T^^}_LINKER=$GNU-gcc"
          } >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace Tauri plugins
        run: node .ci/ci/quiet.mjs pnpm run build:plugins

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: node ${{ github.workspace }}/.ci/ci/quiet.mjs pnpm tauri
          projectPath: apps/gateway-soft
          tagName: ${{ !matrix.manual_upload && 'v__VERSION__' || '' }}
          releaseName: Gateway Soft v__VERSION__
          releaseBody: See the assets to download this version and install.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Upload the encrypted build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/build-logs/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload bundles (manual)
        if: matrix.manual_upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.rust_targets }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # The .sig files feed the linux-armv7 entries the armv7-updater job adds to latest.json.
          shopt -s nullglob
          # -R: the workspace is the gateway-soft-rs checkout, its git remote is not this repo.
          gh release upload "v${VERSION}" -R "$GITHUB_REPOSITORY" --clobber \
            target/${TARGET}/release/bundle/deb/*.deb target/${TARGET}/release/bundle/deb/*.deb.sig \
            target/${TARGET}/release/bundle/rpm/*.rpm target/${TARGET}/release/bundle/rpm/*.rpm.sig

  # tauri-action skips the armv7 bundles (it looks for `_armv7` names, the bundler writes `armhf`), so
  # latest.json gets no armv7 entry and armv7 installs could not update. After every matrix job (they
  # all rewrite latest.json), add linux-armv7-deb / -rpm and linux-armv7 from the uploaded .sig files.
  armv7-updater:
    needs: [plan, build-tauri]
    if: ${{ !cancelled() && contains(needs.plan.outputs.matrix, 'linux-armv7') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: s00d/gateway-soft-rs
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Add linux-armv7 to latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          mkdir -p rel && cd rel
          gh release download "$TAG" -R "$REPO" -p latest.json -p '*armhf.deb.sig' -p '*armhfp.rpm.sig'
          # API asset URLs, as tauri-action writes them: stable when the draft is published.
          gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\") | .assets[] | {name, url}]" > assets.json
          python3 - <<'PY'
          import glob, json
          assets = {a["name"]: a["url"] for a in json.load(open("assets.json"))}
          manifest = json.load(open("latest.json"))
          added = []
          for sig, key in ((glob.glob("*armhf.deb.sig"), "linux-armv7-deb"), (glob.glob("*armhfp.rpm.sig"), "linux-armv7-rpm")):
              if not sig:
                  continue
              package = sig[0][: -len(".sig")]
              url = assets.get(package)
              if not url:
                  raise SystemExit(f"{package} is not in the release")
              manifest["platforms"][key] = {"signature": open(sig[0]).read().strip(), "url": url}
              added.append(key)
          if "linux-armv7-deb" in manifest["platforms"]:
              manifest["platforms"]["linux-armv7"] = manifest["platforms"]["linux-armv7-deb"]
              added.append("linux-armv7")
          if not added:
              raise SystemExit("no armv7 .sig in the release: the armv7 bundles were not signed")
          json.dump(manifest, open("latest.json", "w"), indent=2)
          print("added:", ", ".join(added))
          PY
          gh release upload "$TAG" -R "$REPO" --clobber latest.json
