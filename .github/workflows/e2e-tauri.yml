# Manual only. Runs on the private s00d/gateway-soft-rs checked out here (public repo, free minutes).
# Same rules as build-app.yml: read-only deploy key, no source-derived caches or artifacts, every
# command that can print source (compilers, test failures with code frames) runs through
# ci/quiet.mjs, which hides the output and encrypts it for the owner on failure.
name: E2E Tauri

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA of gateway-soft-rs (empty = its default branch)"
        required: false
        default: ""

permissions:
  contents: read

env:
  LOG_PUBLIC_KEY: ${{ secrets.LOG_PUBLIC_KEY }}
  Q: node ${{ github.workspace }}/.ci/ci/quiet.mjs

jobs:
  e2e-tauri:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            display: ""
          - os: ubuntu-22.04
            display: "xvfb-run -a"
          - os: windows-latest
            display: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: s00d/gateway-soft-rs
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          path: .ci
          sparse-checkout: ci
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev patchelf xvfb

      - name: Install frontend dependencies
        shell: bash
        run: $Q pnpm install --frozen-lockfile

      - name: Run E2E tests (tauri-playwright)
        working-directory: apps/gateway-soft
        shell: bash
        run: $Q ${{ matrix.display }} pnpm test:e2e --project=tauri

      - name: Upload the encrypted log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/build-logs/
          if-no-files-found: ignore
          retention-days: 3
